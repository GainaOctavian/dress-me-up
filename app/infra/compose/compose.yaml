name: dress-me-up

# Local dev stack. MongoDB is Atlas by default (MONGODB_URI in app/.env);
# for a local Mongo add -f compose.local-db.yaml.
# Host-specific values (API_PORT, S3_PUBLIC_ENDPOINT_URL) go in
# app/infra/compose/.env, which is gitignored.
services:
  api:
    build:
      context: ../../..
      dockerfile: app/backend/api/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - ../../.env
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      # presigned URLs must use an address the phone can reach (LAN IP)
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      S3_BUCKET: dress-me-up
      S3_ACCESS_KEY: dev-access-key
      S3_SECRET_KEY: dev-secret-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # S3-compatible object storage (MinIO no longer publishes images).
  seaweedfs:
    image: chrislusf/seaweedfs:3.90
    command: server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      retries: 20

  # one-shot: create the bucket (ignores "already exists")
  seaweedfs-init:
    image: chrislusf/seaweedfs:3.90
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 's3.bucket.create -name dress-me-up' | weed shell -master=seaweedfs:9333; true"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

volumes:
  seaweedfs_data:
