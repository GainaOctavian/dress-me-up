# Optional local MongoDB instead of Atlas:
#   docker compose -f compose.yaml -f compose.local-db.yaml up --build
services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    environment:
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      - mongo

volumes:
  mongo_data:
